<!DOCTYPE html>
<html>
  <head>
    <title>Study Helper</title>
    <style>
      body { font-family: sans-serif; width: 380px; }
      textarea, input[type="text"], select { width: 100%; box-sizing: border-box; }
      #disclaimer { font-size: 11px; color: #666; padding: 6px; background: #f5f5f5; }
      pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
    <script src="popup.js"></script>
  </head>
  <body>
    <div id="disclaimer">
      Dofumo 2026. Study/practice aid only. Answers are AI-generated and may contain
      mistakes, verify before relying on them. The screen-area tool only captures the exact region you
      drag-select. Good luck!
    </div>
    <hr />

    <h4>Settings</h4>
    <label for="api-key-input">Gemini API key:</label>
    <input type="text" id="api-key-input" placeholder="Paste your Gemini API key" />
    <button id="save-key-btn">Save key</button>
    <div id="key-status" style="font-size:11px;color:green;"></div>

    <label for="model-select">Model:</label>
    <select id="model-select">
      <option value="gemini-3.6-flash" selected="true">Gemini 3.6 Flash</option>
      <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
      <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
    </select>
    <hr />

    <h4>Question</h4>
    <div id="question-area" style="padding:10px; background:#fafafa;"></div>
    <button id="copy-question-btn">Copy Question</button>
    <hr />

    <h4>Explanation</h4>
    <div id="answer-area" style="padding:10px; background:#fafafa;"></div>
    <button id="copy-answer-btn">Copy Answer</button>
    <hr />

    <div id="loading" style="display:none;">Loading...</div>

    <textarea id="input-text" rows="4" placeholder="Paste your question here (or highlight text on the page first)"></textarea>
    <button id="submit-text-btn">Get answer</button>
    <button id="use-selection-btn">Use highlighted text from page</button>
    <button id="select-area-btn">Select an area of the screen</button>
    <div id="area-select-hint" style="font-size:11px;color:#666;"></div>
    <hr />
    <button id="get-options-btn">Multiple-choice options</button>
    <button id="get-code-btn">Solve coding problem</button>
  </body>
</html>
